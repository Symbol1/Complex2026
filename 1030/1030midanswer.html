<meta charset="utf-8">

<title>複變期中考對答案</title>
<style>
:root {
  --ans: #c62828;
  --used: #0b62a8;
  --muted: #6b6b6b;
}
body {
  margin: 0;
  background: #e6e6e6;
  color: #222;
  font-family: "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
}
header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 18px;
  padding: 8px 16px;
  background: #fafafa;
  border-bottom: 1px solid #c8c8c8;
}
header label { white-space: nowrap; }
header input {
  width: 10ch;
  padding: 3px 5px;
  font: 15px/1.2 ui-monospace, Consolas, "Cascadia Mono", monospace;
  border: 1px solid #aaa;
  border-radius: 3px;
}
header input#sid { width: 12ch; font-size: 18px; }
header input.used { border-color: var(--used); background: #eaf3fc; }
header input.bad { border-color: #d00; background: #fff0f0; }
header button { font: inherit; padding: 3px 10px; }
.hint { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--muted); }
main { padding: 16px; }
svg.page {
  display: block;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto 16px;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
}
foreignObject { overflow: visible; }
.box { position: relative; width: 100%; height: 100%; }
.ans {
  position: absolute;
  left: 0;
  bottom: 0;
  color: var(--ans);
  font-size: 36px;
  line-height: 1.1;
  white-space: nowrap;
}
.ans.wrap { right: 0; white-space: normal; }
.ans.plain { color: #222; }
.ans .note { color: var(--muted); font-size: 0.75em; }
.ans .used { color: var(--used); font-size: 0.8em; }
.ans sub, .ans sup { font-size: 0.7em; line-height: 0; }
.block {
  width: 100%;
  height: 100%;
  overflow: hidden;
  color: var(--ans);
  line-height: 1.3;
}
.block sub, .block sup { font-size: 0.7em; line-height: 0; }
text.fig {
  fill: var(--ans);
  font-family: "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  font-weight: 700;
  stroke: #fff;
  stroke-width: 5px;
  paint-order: stroke;
}
text.given { fill: #8a8a8a; font-weight: 400; }
text.note { fill: var(--muted); font-weight: 400; }
text.zero { fill: #222; font-weight: 700; }
rect.badge { fill: #f0a500; }
text.badge {
  fill: #000;
  font-family: "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  font-weight: 600;
}
</style>
</head>

// 第 99 題的空白跨到第 8 頁開頭，所以第 8 頁只顯示最上面一條
const VIEW_H = {6: H, 7: 780, 8: 72};
const SVGNS = 'http://www.w3.org/2000/svg', XHTML = 'http://www.w3.org/1999/xhtml';
const ANS = '#c62828';
const ov = {}, stat = {};

function el(tag, attrs, parent, ns = SVGNS) {
  const e = document.createElementNS(ns, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
const $ = id => document.getElementById(id);
const X = x => x * K, Y = y => (H - y) * K;
const sup = n => `<sup>${n}</sup>`, sub = n => `<sub>${n}</sub>`;
const esc = s => s.replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
const num = n => (n < 0 ? '−' + -n : String(n));

// 不是一題一分的題目：[配分, 給分方式]
const POINTS = {};
for (const n of [39, 40, 41, 42]) POINTS[n] = [2, 'loops 1 分、winding numbers 1 分'];

function buildPages() {
  const main = document.querySelector('main');
  for (const p of [6, 7, 8]) {
    const svg = el('svg', {class: 'page', viewBox: `0 0 ${W * K} ${VIEW_H[p] * K}`}, main);
    el('image', {href: BG[p], x: 0, y: 0, width: W * K, height: H * K}, svg);
    stat[p] = el('g', {}, svg);
    ov[p] = el('g', {}, svg);
    for (const [n, [pts, how]] of Object.entries(POINTS)) {
      const it = ITEMS[n];
      if (it.p !== p) continue;
      const g = el('g', {}, stat[p]);
      el('title', {}, g).textContent = `第 ${n} 題 ${pts} 分：${how}`;
      const t = el('text', {x: X(it.l[0]), y: Y(it.l[1] + 10.5), 'font-size': 5.5 * K, class: 'badge',
        'text-anchor': 'middle', 'dominant-baseline': 'central'}, g);
      t.textContent = `${pts} 分`;
      const bb = t.getBBox();
      g.insertBefore(el('rect', {x: bb.x - 1.5 * K, y: bb.y - 0.5 * K, width: bb.width + 3 * K,
        height: bb.height + K, rx: 2 * K, class: 'badge'}), t);
    }
  }
  noteText(8, [56.69, 806], '第 99 題（接續第 7 頁最後一行）');
  drawFigures();
}

// ---------- 圖的答案（與學號無關） ----------

function arrowHead(g, [x, y, deg], color) {
  el('path', {d: 'M 2.8 0 L -1.7 1.9 L -0.8 0 L -1.7 -1.9 Z', fill: color,
    transform: `translate(${x} ${y}) rotate(${deg}) scale(${K})`}, g);
}
function drawFigures() {
  const g = stat[6];
  for (const f of Object.values(FIG)) {
    for (const lp of f.loops || []) {
      el('path', {d: lp.d, fill: 'none', stroke: lp.c, 'stroke-width': 1.1 * K,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round'}, g);
      arrowHead(g, lp.a, lp.c);
    }
    for (const a of f.arrows || []) arrowHead(g, a, ANS);
    for (const [w, x, y, r] of f.regions) {
      const size = Math.min(7.5, Math.max(4.5, 1.5 * r));
      const t = el('text', {x, y, 'font-size': size * K, class: f.given ? 'fig given' : 'fig',
        'text-anchor': 'middle', 'dominant-baseline': 'central'}, g);
      t.textContent = num(w);
    }
  }
  for (const t of Object.values(TT)) {
    el('path', {d: t.d, fill: 'none', stroke: ANS, 'stroke-width': 1.2 * K, 'stroke-linejoin': 'round'}, g);
    t.arrows.forEach(a => arrowHead(g, a, ANS));
    for (const [x, y, o] of t.zeros) {
      el('circle', {cx: x, cy: y, r: 1.2 * K, fill: '#222'}, g);
      const tx = el('text', {x: x + 2.2 * K, y: y - 2.6 * K, 'font-size': 6.5 * K, class: 'fig zero'}, g);
      tx.textContent = o;
    }
    // 說明放在圖的上緣（圖的下方緊接第 50 題的空白）
    [t.note, '黑字是零點的階數；曲線只是一例'].forEach((s, i) => {
      const nt = el('text', {x: t.nxy[0], y: t.nxy[1] + 7 * i * K, 'font-size': 5.5 * K, class: 'fig note',
        'text-anchor': 'middle'}, g);
      nt.textContent = s;
    });
  }
}

// ---------- 把答案放進答案空白 ----------

function makeBox([p, x0, x1, y], html, cls) {
  const w = (x1 - x0) * K, h = 28 * K;
  const fo = el('foreignObject', {x: X(x0), y: Y(y) - 25 * K, width: w, height: h}, ov[p]);
  const box = el('div', {class: 'box'}, fo, XHTML);
  const ans = el('div', {class: 'ans ' + cls}, box, XHTML);
  ans.innerHTML = html;
  return {fo, ans, w, h};
}

// 依序找第一段（略縮字後）放得下的空白；都放不下就用最長的一段，先縮字，再換行
function put(n, html, cls = '') {
  const segs = ITEMS[n].s;
  const shrink = (r, min) => {
    for (let size = 9; r.ans.offsetWidth > r.w && size > min;) {
      size -= 0.5;
      r.ans.style.fontSize = size * K + 'px';
    }
  };
  for (const s of segs) {
    const r = makeBox(s, html, cls);
    shrink(r, 7.5);
    if (r.ans.offsetWidth <= r.w) { r.fo.setAttribute('data-n', n); return; }
    r.fo.remove();
  }
  const s = segs.reduce((a, b) => (b[2] - b[1] > a[2] - a[1] ? b : a));
  const r = makeBox(s, html, cls);
  r.fo.setAttribute('data-n', n);
  shrink(r, 7);
  let size = parseFloat(r.ans.style.fontSize || 9 * K) / K;
  const setSize = () => { r.ans.style.fontSize = size * K + 'px'; };
  if (r.ans.offsetWidth > r.w) {
    r.ans.classList.add('wrap');
    while (r.ans.offsetHeight > r.h && size > 5) { size -= 0.5; setSize(); }
  }
}
// 證明題：用從左邊界開始的整行空白排成一塊（第一段接在題號後面、最後一段太短的都不用）
function putBlock(n, html) {

  if (!rows.length) { put(n, html); return; }

  const top = Math.max(...rows.map(s => s[3])) + 19, bottom = Math.min(...rows.map(s => s[3])) - 3;
  const fo = el('foreignObject', {x: X(x0), y: Y(top), width: (x1 - x0) * K, height: (top - bottom) * K,
    'data-n': n}, ov[p]);

}
const withNote = (main, note) => `<div class="note">${note}</div><div>${main}</div>`;
const withUsed = (main, used) => (used ? `<div class="used">採用 ${used}</div><div>${main}</div>` : main);
function noteText(p, [x, y], str, anchor = 'start') {
  const t = el('text', {x: X(x), y: Y(y), 'font-size': 5.5 * K, class: 'fig note', 'text-anchor': anchor}, stat[p]);
  t.textContent = str;
}

// ---------- 分數與複數的寫法 ----------

const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
// p/q 約分；u 是接在分子後面的單位，例如 πi
function frac(p, q, u = '') {
  if (q < 0) { p = -p; q = -q; }
  const g = gcd(Math.abs(p), q) || 1;
  p /= g; q /= g;
  if (p === 0) return '0';
  const s = p < 0 ? '−' : '', a = Math.abs(p);
  const top = u ? (a === 1 ? u : a + u) : String(a);
  return q === 1 ? s + top : `${s}${top}/${q}`;
}
// 實部 rp/rq 加虛部 ip/iq
function cplx(rp, rq, ip, iq) {
  const re = rp ? frac(rp, rq) : '';
  if (!ip) return re || '0';
  const im = frac(Math.abs(ip), iq, 'i');
  if (!re) return (ip < 0 ? '−' : '') + im;
  return `${re} ${ip < 0 ? '−' : '+'} ${im}`;
}
// 係數乘上 e^a；係數是 '0' 或 '1' 時化簡，係數有加減號時加括號
function timesExp(c, a) {
  if (c === '0') return '0';
  const e = a === '0' ? '' : `e${sup(a)}`;
  if (!e) return c;
  if (c === '1') return e;
  if (c === '−1') return '−' + e;
  return (/ [+−] /.test(c) ? `(${c})` : c) + e;
}
// 首項係數為 1 的部分分式：c/(base)^k
function term(p, q, base, k) {
  if (q < 0) { p = -p; q = -q; }
  const g = gcd(Math.abs(p), q) || 1;
  p /= g; q /= g;
  const pw = k > 1 ? `${base}${sup(k)}` : base;
  const den = q === 1 ? pw : `${q}${pw}`;
  return {neg: p < 0, s: `${Math.abs(p)}/${q === 1 ? den : `(${den})`}`, zero: p === 0};
}
function sumTerms(ts) {
  ts = ts.filter(t => !t.zero);
  if (!ts.length) return '0';
  return ts.map((t, i) => (i ? (t.neg ? ' − ' : ' + ') : (t.neg ? '−' : '')) + t.s).join('');
}
function factRatio(hi, lo) {  // hi!/lo!
  let v = 1n;
  for (let k = BigInt(lo) + 1n; k <= BigInt(hi); k++) v *= k;
  return v.toString();
}

// ---------- 學號與覆寫 ----------

function state() {
  const sid = $('sid').value.trim();
  const digits = sid.replace(/\D/g, '');
  const inp = $('oq');
  if (!digits) { inp.placeholder = ''; return null; }
  const Ntrue = ((BigInt(digits) * 1002003n) % 100000000n).toString().padStart(8, '0');
  inp.placeholder = Ntrue;
  const raw = inp.value.trim();
  inp.classList.remove('used', 'bad');
  let o = null;
  if (raw) {
    o = /^\d{8}$/.test(raw) ? raw : null;
    inp.classList.add(o ? 'used' : 'bad');
  }
  const N = o || Ntrue;
  return {sid, Ntrue, N, over: !!o, q: [...N].map(Number)};
}

// ---------- 答案 ----------

// ω^n = e^{mπi/5}，m = 0, …, 9
const OMEGA = ['1',
  '(1 + √5)/4 + i√(10 − 2√5)/4', '(√5 − 1)/4 + i√(10 + 2√5)/4',
  '(1 − √5)/4 + i√(10 + 2√5)/4', '−(1 + √5)/4 + i√(10 − 2√5)/4', '−1',
  '−(1 + √5)/4 − i√(10 − 2√5)/4', '(1 − √5)/4 − i√(10 + 2√5)/4',
  '(√5 − 1)/4 − i√(10 + 2√5)/4', '(1 + √5)/4 − i√(10 − 2√5)/4'];
// F_nG_n 的收斂半徑 (√5 − 1)(m − √(m² − 4))/4，m = q_7 + 2
const R65 = ['(√5 − 1)/2', '√5 − 2', '(√5 − 1)(2 − √3)/2', '(√5 − 1)(5 − √21)/4', '(√5 − 1)(3 − 2√2)/2',
  '(5√5 − 11)/2', '(√5 − 1)(4 − √15)/2', '(√5 − 1)(9 − √77)/4', '(√5 − 1)(5 − 2√6)/2', '(√5 − 1)(11 − 3√13)/4'];

function render() {
  for (const p in ov) ov[p].replaceChildren();
  const st = state();
  if (!st) return;
  const Q = j => st.q[j - 1];

  put(2, esc(st.sid), 'plain');
  put(3, withUsed(st.Ntrue, st.over && st.N));

  // 是非題：第 10 + j 與 20 + j 題用 q_j
  const tf = (j, tv, y = 'T', n = 'F') => (tv ? Q(j) + y : 9 - Q(j) + n);
  // 11: exp(a + b) = exp a exp b；12: −1 − i 在 branch cut 上；13: Arg(−2 − i) = π + arctan(1/2)；
  // 14: −2 − (q_2 + 1/2)i 在拋物線上方 ⇔ q_2 ≤ 3；15: 例如 w = 1 + i、z = −2 − 2i；16: 兩邊都是 e^{z̄}；
  // 17: |z| < 1 ⇔ −4 ≤ q_7 − q_1 ≤ 5；18: 是單位閉圓盤去掉可數多點
  [true, false, true, Q(2) <= 3, false, true, Q(7) - Q(1) >= -4 && Q(7) - Q(1) <= 5, false]
    .forEach((tv, i) => put(11 + i, tf(i + 1, tv)));
  // 21: 收斂 ⇔ q_4 > q_6；22: ratio test；23: n^{1/n} ≤ 2；24: ratio test；25: q_4 奇數時是 z²；
  // 26: q_7 奇數時是 1/z；27: e^{z²}；28: sin z̄
  [Q(4) > Q(6), true, false, true, Q(4) % 2 === 1, Q(7) % 2 === 1, true, false]
    .forEach((tv, i) => put(21 + i, tf(i + 1, tv, 'Y', 'N')));

  // 計算
  {
    const p = `2${sup(num(6 * Q(6) - 2001))}`;
    put(29, withNote(`−${p} − √3·${p} i`, `= −${p}(1 + √3 i)`));
  }
  put(30, '3i/5');
  put(31, 'e');
  {
    const m = (Q(3) + 2 * Q(4) + 5 * Q(5)) % 10;
    put(32, withNote(OMEGA[m], `e${sup(`${m}πi/5`)}`));
  }
  {
    const N = 10 * Q(7) + Q(8);
    let s = '0';
    if (N >= 2 && N % 2 === 0) s = N === 2 ? '2πi' : `${((N - 2) / 2) % 2 ? '−' : ''}2πi/${N - 1}!`;
    put(33, withNote(s, `指數 −${N}`));
  }
  put(34, '−2πi');
  put(35, frac(2, Q(3) + Q(2) + 2, 'πi'));
  put(36, '2πi');
  put(37, '−3π');
  put(38, '2πi');

  // 共圓
  put(50, 'A = (z₁ − z₃)(z₂ − z₄)、B = (z₁ − z₄)(z₂ − z₃) ≠ 0；A·B̄ = (A/B)|B|²，|B|² &gt; 0，所以 A·B̄ 是實數 ⇔ A/B 是實數');
  put(51, Q(4) % 2 === 0
    ? 'Yes：第四點 4 + 5i，四點都在 |z − (1 + i)| = 5 上；10(−3 + i)(2 + 4i)(5 − 5i) = −1000 是實數'
    : 'No：第四點 5 + 5i；10(−4 + i)(1 + 4i)(5 − 5i) = −1150 − 350i 不是實數');
  put(52, withNote('f(z) = −i(z − 1 − i)/(z + 2 − i)', 'a = 3、b = −1、b′ = −1、c = 2、c′ = −1'));
  {
    const k = Q(7) + 2;
    put(53, frac(-(k * k + 1), k * k - 1));
    put(54, frac(2 * k, k * k - 1));
  }
  put(55, 'Apollonius');

  // Strassnitzky
  put(56, '9 + 7i');
  put(57, '65 + 65i');
  put(58, 'π/4');
  put(59, 'π = 4arctan(1/2) + 4arctan(1/5) + 4arctan(1/8)');
  put(60, withNote('9/5 + 51/65 + 129/260', '= 4(9/20 + 51/260 + 129/1040)'));
  put(61, '801/260');

  // 子集合計數，m = 5 + (−1)^{q_1} + ((−1)^{q_2} + 1)/2
  {
    const m = 5 + (Q(1) % 2 ? -1 : 1) + (Q(2) % 2 ? 0 : 1);
    put(62, '1');
    put(63, withNote(`2${sup(m)} = ${2 ** m}`, `m = ${m}`));
    put(64, `(2${sup(3 * m)} + 2${sup(m + 1)})/3 = ${(2 ** (3 * m) + 2 ** (m + 1)) / 3}`);
  }

  // Taylor 與 Laurent
  put(65, withNote(R65[Q(7)], `(√5 − 1)(m − √(m${sup(2)} − 4))/4，m = ${Q(7) + 2}`));
  put(66, 'π − 3');
  put(67, `1/${Q(2) + 2} &lt; |z| &lt; ${Q(2) + 2}`);
  put(68, '1/2520');
  {
    const m = Q(7) + Q(4), s = m % 2 ? '−' : '', v = factRatio(4 * m + 2, 2 * m + 1);
    put(69, `${s}${4 * m + 2}!/${2 * m + 1}!` + (v.length <= 15 ? ` = ${s}${v}` : ''));
  }
  put(70, '0');
  {
    const a = cplx(Q(2), 1, Q(5), 1);
    put(71, timesExp(a, a));
    put(72, timesExp(cplx(1 + Q(2), 1, Q(5), 1), a));
    put(73, timesExp(cplx(2 + Q(2), 2, Q(5), 2), a));
  }

  // DongHwa
  put(74, '1');
  put(75, `b${sub('n')} = Σ${sub('k≥n')} C(k, n) a${sub('k')} (1/2)${sup('k−n')}`);
  put(76, `c${sub('n')} = Σ${sub('k≥n')} C(k, n) b${sub('k')} (1/2)${sup('k−n')}`);
  putBlock(77, '從 i 到 u + vi 的線段上每點的虛部 ≥ m = min(1, v)，所以到 ℤ 的距離 ≥ m，'
    + '每個圓心的 Taylor series 收斂半徑 ≥ m。在線段上取間距 &lt; m 的有限多個圓心，'
    + '每個圓心都在前一個圓心的收斂圓盤內，依序 re-expand 即可。');
  putBlock(78, '在 x + yi 的收斂半徑 ≥ y（在 yi 恰為 y）。例如 i → 1.5i，再 yi → (2y − 1)i 九次到 257i'
    + '（每步 y − 1 &lt; y），然後 250 + 257i、500 + 257i、750 + 257i、1000 + 257i（每步 250 &lt; 257），'
    + '最後到 1000 + i（256 &lt; 257），共 15 步。');

  // KaoHsiung：R(z) = (z + q_1)/(z − 1)²(z + 2)
  {
    const q1 = Q(1);
    put(79, sumTerms([term(1 + q1, 3, '(z − 1)', 2), term(2 - q1, 9, '(z − 1)', 1)]));
    const c = term(q1 - 2, 9, '(z + 2)', 1);
    put(80, c.zero ? withNote('0', 'q₁ = 2 時 z + 2 約掉，−2 是 removable singularity') : sumTerms([c]));
  }
  putBlock(81, 'S − R 在 ℂ ∖ {1, −2} 上 holomorphic。設 P 是 1 的 principal part，'
    + 'S − P 與 R − P 在 1 附近都 holomorphic，所以 S − R = (S − P) − (R − P) 在 1 是 removable；−2 同理。'
    + '補上這兩點的值之後 S − R 是 entire。');

  putBlock(82, '|f| = c &gt; 0 時，在每點附近取 log f 的 branch，Re log f = ln c 是常數，'
    + '由 Cauchy–Riemann equations，Im log f（f 的 argument）也是常數；U connected，所以 Arg f 是常數。'
    + '（或：u² + v² = c² 對 x、y 微分，配合 Cauchy–Riemann equations 得 f′ = 0。）');
  put(83, `|f| = c &gt; 0：f = ce${sup('i Arg f')} 是常數（上一題）；|f| = 0：f ≡ 0`);
  putBlock(84, `|e${sup('f')}| = e${sup('Re f')} ≤ 1，由 Liouville，e${sup('f')} 是常數；f′e${sup('f')} = 0 而 e${sup('f')} ≠ 0，所以 f′ = 0，f 是常數，矛盾。`);

  // Picard
  put(85, 'None');
  put(86, 'None');
  put(87, '0');
  put(88, '−2');

  putBlock(89, 'a<sub>n</sub> = (1/2πi)∮<sub>|z|=ρ</sub> f(z)z<sup>−n−1</sup> dz，所以 ρ ≥ R 時 |a<sub>n</sub>| ≤ Bρ<sup>5/2−n</sup>，'
    + 'n ≥ 3 時令 ρ → ∞ 得 a<sub>n</sub> = 0。f = a<sub>0</sub> + a<sub>1</sub>z + a<sub>2</sub>z²，'
    + '|z| 大時 |f(z)| ≤ C|z|²，與 |f(z)| ≥ A|z|<sup>5/2</sup> 矛盾。');
  putBlock(90, 'q(z) = 1 + a<sub>n−1</sub>z + ⋯ + a<sub>0</sub>z<sup>n</sup> 是多項式，q(0) = 1。'
    + '|z| = 1 時 1/z = z̄，|q(z)| = |p(z̄)|。由 maximum modulus principle，'
    + 'max<sub>|z|=1</sub>|q| ≥ |q(0)| = 1，所以某個 |z| = 1 有 |p(z̄)| ≥ 1。');
  putBlock(91, '設 a ∈ L(V)、a ∉ U，要證 a ∈ L(U)。給定 r &gt; 0，D(a, r) ∖ {a} 含某個 v ∈ V。'
    + '若 v ∈ U 即得；否則 v ∈ L(U)，取 s = min(r − |v − a|, |v − a|) &gt; 0，D(v, s) ∖ {v} 含某個 u ∈ U，'
    + '|u − a| &lt; s + |v − a| ≤ r，且 |u − v| &lt; s ≤ |v − a| 所以 u ≠ a。');
  put(92, withNote('例：{(1 − 1/n)e<sup>2πik/n</sup> : n ≥ 2, 0 ≤ k &lt; n}，limit points 是整個 |z| = 1',
    '每個 |z| ≤ r &lt; 1 只含有限多點、且有無限多個 limit points 即可，如 {(1 − 1/n)e<sup>in</sup>}'));
  put(93, '−π²');
  put(94, withNote(`−2i/(3z${sup(2)} + ${2 * (Q(8) + 5)}z + 3)`,
    `或等價的寫法；積分值 2π/√${(Q(8) + 2) * (Q(8) + 8)} 是 AI 陷阱`));
  put(95, '2π');

  // ChengKung：2k = |2(q_5 − q_6) + 1|
  {
    const k2 = Math.abs(2 * (Q(5) - Q(6)) + 1);
    put(96, `πe${sup('−' + k2)}/2`);
    put(97, 'πR/(R² − 4)');
    put(98, `πe${sup('−' + k2)}/2`);
    put(99, withNote(`π sinh(${k2})/2`, `= π(e${sup(k2)} − e${sup('−' + k2)})/4`));
  }
}
